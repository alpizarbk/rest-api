name: deploy
 
on:
  push:
    branches: ["main"]
 
env:
  REGISTRY: alpizarbk
  IMAGE_NAME: rest_api
 
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        name: code checkout
 
      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
 
      - name: Build & Push
        uses: docker/build-push-action@v3
        with: 
          push: true
          build-args: | 
            APP_ENV=${{ secrets.APP_ENV }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}:latest
 
  test:
    name: Run tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run test
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install --legacy-peer-deps
      - run: npm run test

      - name: Test succeded?
        if: ${{ success() }}
        run: echo "Test Exitoso!!!"

      - name: Test failed?
        if: ${{ failure() }}
        run: |
          echo "Test Falló!!!"

  codeScan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
 
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env: 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
 

      - name: Get SonarCloud status
        run: |
         echo "SONAR_STATUS=$(curl -s -u ${{ secrets.SONAR_TOKEN}}: https://sonarcloud.io/api/qualitygates/project_status?projectKey=${{ secrets.SONAR_PROJECT_KEY }} | jq -r '.projectStatus.status')" >> $GITHUB_ENV

      - name: Sonar Status
        run: echo ${{ env.SONAR_STATUS }}

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Run Snyk to check Docker image for vulnerabilities
      uses: snyk/actions/docker@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        image: ${{ env.REGISTRY}}/${{ env.IMAGE_NAME }}:latest
